<header class="navbar bg-base-100 border-b border-base-300 px-4 shrink-0 shadow-sm z-10 flex justify-between items-center">
  <!-- Left: Logo & Mobile Drawer Toggle -->
  <div class="flex-none flex items-center gap-3">
    <div class="lg:hidden">
      <label for="main-drawer" class="btn btn-square btn-ghost btn-sm"><i data-feather="menu"></i></label>
    </div>
    <div class="bg-primary p-1.5 rounded-lg lg:hidden">
      <img src="/ui/assets/pclink.svg" class="w-5 h-5 icon-white" alt="Logo" />
    </div>
    <div>
      <h1 class="text-xl font-black leading-none">PCLink</h1>
      <span class="text-[10px] opacity-50 uppercase font-black tracking-widest">Control Panel</span>
    </div>
  </div>

  <!-- Center: Prominent & Popping Command Palette Search Bar (Ctrl + K) -->
  <div class="hidden md:flex flex-1 justify-center max-w-md mx-6">
    <button class="btn btn-sm border-2 border-primary/40 hover:border-primary bg-primary/5 hover:bg-primary/10 w-full justify-between font-extrabold text-xs text-base-content normal-case rounded-2xl px-3.5 shadow-sm hover:shadow-md transition-all group" onclick="window.openCommandPalette()">
      <span class="flex items-center gap-2.5">
        <span class="bg-primary text-white p-1 rounded-lg group-hover:scale-110 transition-transform">
          <i data-feather="search" class="w-3.5 h-3.5"></i>
        </span>
        <span class="tracking-tight">Search commands, tabs, or settings...</span>
      </span>
      <kbd class="kbd kbd-xs bg-primary text-white font-mono font-black border-none px-1.5 shadow-sm group-hover:bg-primary-focus">Ctrl K</kbd>
    </button>
  </div>

  <!-- Right: Notifications & Status Badges -->
  <div class="flex-none flex gap-2 items-center">
    <!-- PCLink App Update Badge Button -->
    <button id="headerPclinkUpdateBadge" class="btn btn-xs btn-warning text-warning-content font-extrabold gap-1 animate-pulse hidden" onclick="window.openPclinkUpdateSidePanel()" title="PCLink server update available">
      <i data-feather="arrow-up-circle" class="w-3.5 h-3.5"></i>
      <span id="headerPclinkUpdateTag" class="font-mono text-[10px]">Update</span>
    </button>

    <!-- Notification Center Bell Button (Reuses Side Panel) -->
    <button class="btn btn-ghost btn-circle btn-sm relative" onclick="window.openNotificationPanel()" title="Notification Center">
      <i data-feather="bell" class="w-4 h-4"></i>
      <span id="notificationBadgeCount" class="badge badge-error badge-xs absolute -top-1 -right-1 font-bold text-[9px] hidden">0</span>
    </button>

    <!-- Server Status Badge -->
    <div class="badge badge-outline gap-2 py-3 px-3 border-base-300" id="serverStatusBadge">
      <span class="status-dot online w-2 h-2 rounded-full bg-success"></span>
      <span id="serverStatusText" class="text-sm font-black uppercase tracking-wider">Online</span>
    </div>
    <button class="btn btn-ghost btn-sm text-error ml-1" onclick="logout()" title="Logout"><i data-feather="log-out"></i></button>
  </div>
</header>
