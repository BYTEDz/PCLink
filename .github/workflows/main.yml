name: PCLink CI & Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Fetch pre-built FerrumCast binaries from its GitHub Releases repository.
  build-ferrumcast:
    name: Fetch FerrumCast Release Assets
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      FERRUMCAST_REPO: BYTEDz/FerrumCast
      FERRUMCAST_TAG: ""
    steps:
      - name: Download FerrumCast Release Assets
        env:
          GH_TOKEN: ${{ secrets.FERRUMCAST_PAT || secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p out/windows out/linux-x86_64 out/linux-aarch64 temp_downloads

          # Determine target tag (fetch latest release tag from FerrumCast if not explicitly set)
          TARGET_TAG="${FERRUMCAST_TAG}"
          if [ -z "$TARGET_TAG" ]; then
            echo "No FerrumCast tag specified. Fetching latest release tag from ${FERRUMCAST_REPO}..."
            TARGET_TAG=$(gh release view --repo "${FERRUMCAST_REPO}" --json tagName -q .tagName)
          fi
          echo "Using FerrumCast version: ${TARGET_TAG}"

          # Download all release assets using GitHub CLI
          gh release download "${TARGET_TAG}" --repo "${FERRUMCAST_REPO}" --dir temp_downloads

          echo "Downloaded raw assets:"
          ls -la temp_downloads/

          # Unpack assets into platform output directories
          for f in temp_downloads/*; do
            filename=$(basename "$f")
            echo "Extracting asset: $filename..."

            if [[ "$filename" == *"pc-windows-msvc"* ]]; then
              if [[ "$filename" == *.zip ]]; then
                unzip -o "$f" -d out/windows || true  # unzip exits 1 on backslash path warnings; extraction is still valid
              else
                cp "$f" out/windows/
              fi
            elif [[ "$filename" == *"x86_64-unknown-linux-gnu"* ]]; then
              if [[ "$filename" == *.tar.gz ]]; then
                tar -xzf "$f" -C out/linux-x86_64
              elif [[ "$filename" == *.zip ]]; then
                unzip -o "$f" -d out/linux-x86_64
              else
                cp "$f" out/linux-x86_64/
              fi
            elif [[ "$filename" == *"aarch64-unknown-linux-gnu"* ]] || [[ "$filename" == *"arm64"* ]]; then
              if [[ "$filename" == *.tar.gz ]]; then
                tar -xzf "$f" -C out/linux-aarch64
              elif [[ "$filename" == *.zip ]]; then
                unzip -o "$f" -d out/linux-aarch64
              else
                cp "$f" out/linux-aarch64/
              fi
            fi
          done

          echo "Windows asset contents:" && ls -la out/windows/
          echo "Linux x86_64 asset contents:" && ls -la out/linux-x86_64/
          echo "Linux aarch64 asset contents:" && ls -la out/linux-aarch64/

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ferrumcast-x86_64-pc-windows-msvc
          path: out/windows

      - name: Upload Linux x86_64 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ferrumcast-x86_64-unknown-linux-gnu
          path: out/linux-x86_64

      - name: Upload Linux aarch64 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ferrumcast-aarch64-unknown-linux-gnu
          path: out/linux-aarch64

  # Build Windows distributions in parallel.
  build-windows:
    needs: build-ferrumcast
    name: Build Windows (${{ matrix.format }})
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        format: [portable, installer]
    steps:
      - name: Check out PCLink
        uses: actions/checkout@v4

      - name: Download FerrumCast Windows binaries
        uses: actions/download-artifact@v4
        with:
          name: ferrumcast-x86_64-pc-windows-msvc
          path: temp-ferrumcast

      - name: Prepare FerrumCast binaries for packaging
        shell: powershell
        run: |
          $binDir = "src\pclink\assets\bin"
          if (!(Test-Path $binDir)) { New-Item -ItemType Directory -Force -Path $binDir }
          Copy-Item -Path "temp-ferrumcast\*" -Destination $binDir -Recurse -Force
          Write-Host "Binaries injected for PyInstaller: $binDir"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install PCLink Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Install Inno Setup
        if: matrix.format == 'installer'
        run: choco install innosetup -y --no-progress

      - name: Build ${{ matrix.format }} Package
        run: python scripts/build.py --format ${{ matrix.format }} --clean

      - name: Upload Windows Artifact (${{ matrix.format }})
        uses: actions/upload-artifact@v4
        with:
          name: PCLink-Windows-${{ matrix.format }}
          path: releases/
          compression-level: 0

  # Package Linux distributions for target architectures using NFPM.
  build-linux:
    needs: build-ferrumcast
    name: Build Linux Packages (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - arch: amd64
            os: ubuntu-latest
          - arch: arm64
            os: ubuntu-24.04-arm
    steps:
      - name: Check out PCLink
        uses: actions/checkout@v4

      - name: Download FerrumCast Linux binaries
        uses: actions/download-artifact@v4
        with:
          name: ferrumcast-${{ matrix.arch == 'arm64' && 'aarch64-unknown-linux-gnu' || 'x86_64-unknown-linux-gnu' }}
          path: temp-ferrumcast
        continue-on-error: true

      - name: Prepare FerrumCast binaries
        run: |
          mkdir -p src/pclink/assets/bin
          if [ -d "temp-ferrumcast" ]; then
            cp -r temp-ferrumcast/* src/pclink/assets/bin/
            [ -f src/pclink/assets/bin/ferrumcast ] && chmod +x src/pclink/assets/bin/ferrumcast
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Packaging Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential dpkg-dev rpm python3-pip wget
          python3 -m pip install --upgrade pip
          pip install wheel setuptools build pyyaml

      - name: Install NFPM
        run: |
          NFPM_VERSION="2.40.0"
          NFPM_ARCH=${{ matrix.arch == 'arm64' && 'arm64' || 'amd64' }}
          wget "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/nfpm_${NFPM_VERSION}_${NFPM_ARCH}.deb"
          sudo dpkg -i nfpm_${NFPM_VERSION}_${NFPM_ARCH}.deb

      - name: Build Packages (${{ matrix.arch }})
        run: python3 scripts/build.py --format nfpm --arch ${{ matrix.arch }}

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PCLink-Linux-${{ matrix.arch }}
          path: releases/
          compression-level: 0

  # Consolidate builds and publish release to GitHub.
  publish-release:
    name: Publish GitHub Release
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Check out PCLink
        uses: actions/checkout@v4

      - name: Download PCLink build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: PCLink-*
          path: artifacts/

      - name: Clean up unused artifacts
        run: |
          rm -rf artifacts/ferrumcast-*

      - name: Generate Checksum File
        run: |
          cd artifacts
          find . -type f -exec sha256sum {} + | sort > ../SHA256SUMS.txt

      - name: Extract Release Notes from CHANGELOG
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"
          NOTES=$(awk -v ver="$VERSION" 'BEGIN{p=0} /^## \['"$VERSION"'\]/{p=1;next} /^## \[/{p=0} p' CHANGELOG.md)
          if [ -z "$NOTES" ]; then NOTES="See CHANGELOG.md for details."; fi
          echo "$NOTES" > RELEASE_NOTES.md
          echo "TAG=$TAG" >> $GITHUB_ENV

      - name: Generate Dynamic PKGBUILD
        run: |
          VERSION="${TAG#v}"
          python scripts/build.py --format pkgbuild --version "$VERSION"
          mv releases/PKGBUILD artifacts/PKGBUILD

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PRERELEASE_FLAG=""
          if [[ "$TAG" =~ [0-9]+\.[0-9]+\.[0-9]+-.* ]] || [[ "$TAG" =~ (beta|alpha|rc) ]]; then
            PRERELEASE_FLAG="--prerelease"
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists. Updating notes and uploading assets..."
            gh release edit "$TAG" --notes-file RELEASE_NOTES.md
            gh release upload "$TAG" ./artifacts/*/* ./artifacts/PKGBUILD SHA256SUMS.txt
          else
            echo "Creating new release $TAG..."
            gh release create "$TAG" ./artifacts/*/* ./artifacts/PKGBUILD SHA256SUMS.txt \
              --title "Release $TAG" \
              --notes-file RELEASE_NOTES.md \
              $PRERELEASE_FLAG
          fi
